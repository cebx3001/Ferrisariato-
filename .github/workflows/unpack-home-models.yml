name: Unpack HOME customer GLB assets
on:
  push:
    branches: [main]
    paths:
      - 'home/assets/models/sofa-exterior-original.glb.gz'
      - 'home/assets/models/sunray-daybed-original.glb.gz'
      - '.github/workflows/unpack-home-models.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress large original GLBs
        run: |
          set -eu
          gzip -cd home/assets/models/sofa-exterior-original.glb.gz > home/assets/models/sofa-exterior-original.glb
          gzip -cd home/assets/models/sunray-daybed-original.glb.gz > home/assets/models/sunray-daybed-original.glb
          python - <<'PY'
          from pathlib import Path
          for name in ('sofa-exterior-original.glb','sunray-daybed-original.glb'):
              b=(Path('home/assets/models')/name).read_bytes()
              assert b[:4]==b'glTF', name
              print(name,len(b),'bytes')
          PY
      - name: Commit browser-loadable GLBs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home/assets/models/sofa-exterior-original.glb home/assets/models/sunray-daybed-original.glb
          if ! git diff --staged --quiet; then
            git commit -m 'Unpack supplied HOME models for browser'
            git push
          fi
